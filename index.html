<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070713" />
    <meta name="description" content="My Chaos Pet — raise, play with, and evolve your own glowing cosmic creature. A juicy browser pet-care arcade game." />
    <meta property="og:title" content="My Chaos Pet" />
    <meta property="og:description" content="Raise a glowing chaos pet, play arcade minigames, and evolve it into a cosmic legend." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25'%3E%3Cstop offset='0%25' stop-color='%2367e8f9'/%3E%3Cstop offset='60%25' stop-color='%23f472b6'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='%23070713'/%3E%3Cellipse cx='50' cy='54' rx='34' ry='32' fill='url(%23g)'/%3E%3Ccircle cx='40' cy='48' r='6' fill='%23fff'/%3E%3Ccircle cx='62' cy='48' r='6' fill='%23fff'/%3E%3Ccircle cx='41' cy='49' r='3' fill='%23131022'/%3E%3Ccircle cx='63' cy='49' r='3' fill='%23131022'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <title>My Chaos Pet</title>
    <style>
      /* Critical splash shown before React hydrates so there's never a blank flash */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #1b1340, #070713 70%);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #boot .egg {
        width: 92px;
        height: 110px;
        border-radius: 50% 50% 48% 52% / 60% 60% 40% 40%;
        background: linear-gradient(160deg, #67e8f9, #f472b6 55%, #a855f7);
        box-shadow: 0 0 60px rgba(168, 85, 247, 0.55), inset 0 -12px 24px rgba(0, 0, 0, 0.25);
        animation: bootwobble 1.6s ease-in-out infinite;
      }
      #boot p {
        position: absolute;
        bottom: 18%;
        color: #c4b5fd;
        font-family: "Fredoka", system-ui, sans-serif;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-size: 12px;
        animation: bootpulse 1.6s ease-in-out infinite;
      }
      @keyframes bootwobble {
        0%, 100% { transform: rotate(-6deg) translateY(0); }
        50% { transform: rotate(6deg) translateY(-10px); }
      }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="egg"></div>
        <p>Hatching</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
